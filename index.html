<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenWithLove — Anniversary A1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap');

:root{
  --rose:#b86f7d;
  --deep:#76505a;
  --dust:#d9b8bd;
  --blush:#ead4d5;
  --cream:#fbf7f1;
  --paper:#fffdf9;
  --sage:#aeb8aa;
  --ink:#4c3b3e;
  --line:#eadedf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}
body{overflow-x:hidden}
button{font:inherit}
button:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
.app{min-height:100svh;background:linear-gradient(135deg,#fbf7f1,#f7eeee 55%,#f3e9e9);position:relative;overflow:hidden}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 80% 70%,#fff 0 1px,transparent 1.5px);background-size:120px 120px,160px 160px}
.screen{display:none;min-height:100svh;padding:clamp(22px,4vw,52px);position:relative;animation:fadeUp .65s cubic-bezier(.2,.7,.2,1)}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{position:absolute;top:22px;left:50%;transform:translateX(-50%);letter-spacing:4px;font-size:9px;color:var(--deep);opacity:.72;z-index:10}
.serif{font-family:"Cormorant Garamond",serif}
.script{font-family:Parisienne,cursive}
.kicker{text-transform:uppercase;letter-spacing:3px;font-size:9px;color:var(--rose);font-weight:600}
.btn{border:1px solid #d5b6bb;background:#fffaf7;color:var(--deep);border-radius:999px;padding:12px 27px;cursor:pointer;box-shadow:0 8px 24px #76505a16;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px #76505a22}
.back{position:absolute;right:24px;top:22px;border:1px solid #dbc5c7;background:#fffaf7d9;color:var(--deep);padding:8px 15px;border-radius:999px;cursor:pointer;z-index:20}
.personalization{font-size:12px;letter-spacing:1px;color:var(--rose)!important}
.music-player{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:10px}
.music-player .btn{padding:10px 18px}
#music-status{font-size:12px;color:var(--deep);background:#fffdf9e8;border-radius:999px;padding:7px 11px}
#background-music{display:none}

/* password */
.password{align-items:center;justify-content:center}
.pass-wrap{width:min(1080px,100%);display:grid;grid-template-columns:1fr .8fr;gap:clamp(35px,7vw,100px);align-items:center}
.pass-intro{padding:25px}
.pass-intro h1{font-family:"Cormorant Garamond",serif;font-size:clamp(48px,7vw,82px);font-weight:600;line-height:.92;color:var(--deep);margin:14px 0}
.pass-intro p{max-width:470px;line-height:1.8;color:#786568}
.memory-heart{width:min(380px,70vw);aspect-ratio:1;margin:0 auto 10px;position:relative}
.memory-heart img{width:100%;height:100%;object-fit:cover;object-position:center 55%;clip-path:polygon(50% 94%,8% 56%,2% 46%,0 36%,4% 26%,12% 19%,22% 16%,32% 19%,42% 28%,50% 38%,58% 28%,68% 19%,78% 16%,88% 19%,96% 26%,100% 36%,98% 46%,92% 56%)}
.pass-card{background:#fffdf9;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 25px 70px #76505a16;text-align:center}
.lock{font-size:23px}.pass-card h2{font-family:"Cormorant Garamond",serif;font-size:31px;font-weight:600;margin:8px 0;color:var(--deep)}
.boxes{display:flex;justify-content:center;gap:9px;margin:18px 0 22px}
.box{width:45px;height:48px;border:1px solid #d7c0c3;border-radius:12px;display:grid;place-items:center;color:var(--deep);font-weight:600;background:#fff}
.box.active{border-color:var(--rose);box-shadow:0 0 0 3px #b86f7d18}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:255px;margin:auto}
.key{border:1px solid #eadfe0;background:#fdf9f6;color:var(--deep);aspect-ratio:1;border-radius:50%;cursor:pointer;font-size:16px;transition:.2s}
.key:active{transform:scale(.93);background:#f4e7e9}
.enter{grid-column:1/-1;aspect-ratio:auto;border-radius:30px;padding:11px}

/* wrong */
.error{position:fixed;inset:0;background:linear-gradient(135deg,#9b626e,#76505a);color:#fff;z-index:50;display:none;align-items:center;justify-content:center;text-align:center}
.error.show{display:flex}
.error-title{font-family:Parisienne,cursive;font-size:clamp(55px,9vw,92px)}
.error-inner p{opacity:.85}.error .btn{background:#fff;color:var(--deep);border:0}

/* yes/no */
.surprise{align-items:center;justify-content:center}
.yesno{width:min(1100px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fffdf9;border:1px solid var(--line);box-shadow:0 25px 70px #76505a18;overflow:hidden}
.yes-left{min-height:620px;background:#f5e8e7;display:grid;place-items:center;padding:45px}
.yes-photo{width:min(410px,75vw);aspect-ratio:1.05;background:linear-gradient(145deg,#d7afb5,#c58a96);border:10px solid #fffdf9;box-shadow:0 18px 40px #76505a22;display:grid;place-items:center;text-align:center;color:white;position:relative;overflow:hidden}
.yes-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yes-photo:before,.yes-photo:after{content:"";position:absolute;border:1px solid #fff8;inset:15px}
.yes-right{min-height:620px;background:#ead4d5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px}
.yes-right h1{font-family:Parisienne,cursive;font-size:clamp(50px,7vw,82px);font-weight:400;color:var(--deep);line-height:1;margin:12px 0 20px}
.yes-right p{font-family:"Cormorant Garamond",serif;font-size:26px;color:#695459;margin:0 0 28px}
.couple{font-size:48px;opacity:.8;margin-bottom:25px}
.choice{display:flex;gap:14px}.choice .btn{min-width:105px}

/* no */
.nope{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 25%,#fffaf7,#ead4d5 72%)}
.nope-inner{width:min(720px,100%);padding:35px 20px}
.nope h1{font-family:Parisienne,cursive;font-weight:400;font-size:clamp(58px,9vw,96px);color:var(--deep);line-height:1.05;margin:20px 0 8px}
.nope-inner p{color:#695459;margin:0 0 24px}
.bear-battle{height:145px;display:flex;align-items:center;justify-content:center;gap:clamp(20px,8vw,90px);font-size:clamp(70px,12vw,108px)}
.bear{display:inline-block;animation:battleLeft .9s ease-in-out infinite alternate}
.bear:last-child{animation-name:battleRight}
.battle-spark{font-size:32px;color:var(--rose);animation:spark .65s ease-in-out infinite alternate}
@keyframes battleLeft{to{transform:translate(17px,-8px) rotate(14deg)}}
@keyframes battleRight{to{transform:translate(-17px,-8px) rotate(-14deg)}}
@keyframes spark{to{transform:scale(1.25) rotate(15deg)}}
.nope .btn{min-width:140px}

/* gifts */
.gifts{align-items:center;justify-content:center;text-align:center}
.gift-wrap{width:min(980px,100%)}.gift-wrap h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(55px,8vw,82px);color:var(--deep);margin:8px 0}
.gift-wrap p{color:#806d70}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,5vw,65px);margin-top:65px}
.gift{border:0;background:none;cursor:pointer;color:var(--deep);transition:.35s}.gift:hover{transform:translateY(-8px)}
.gift-box{height:175px;max-width:205px;margin:auto;position:relative;background:linear-gradient(135deg,#b97884,#9d626f);border-radius:8px;box-shadow:0 18px 35px #76505a22}
.gift-box:before{content:"";position:absolute;left:44%;width:12%;height:100%;background:#d9bd84}
.gift-box:after{content:"";position:absolute;left:28%;top:-23px;width:44%;height:42px;border:7px solid #d9bd84;border-radius:50% 50% 12% 50%;transform:rotate(-7deg)}
.gift-label{display:inline-block;margin-top:17px;padding:8px 22px;border:1px solid #d8c2c5;border-radius:999px;background:#fffaf7;font-size:12px;letter-spacing:1px}

/* gift 1 */
.inner{width:min(1050px,100%);margin:auto;text-align:center;color:var(--deep);padding-top:30px}
.inner h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(52px,7vw,78px);margin:10px}
.gift1-content{display:grid;grid-template-columns:minmax(220px,360px) minmax(280px,390px);gap:clamp(30px,7vw,90px);align-items:center;justify-content:center;margin:36px auto 0}
.photo-strip{display:grid;gap:14px;margin:0}
.small-photo{min-height:145px;aspect-ratio:1.65;background:linear-gradient(145deg,#d9b1b7,#c78c98);border:7px solid #fffdf9;box-shadow:0 12px 28px #76505a18;display:grid;place-items:center;color:white;font-size:11px;letter-spacing:1px;opacity:0;animation:photoReveal .65s ease-out forwards;position:relative;overflow:hidden}
.small-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-caption{position:relative;z-index:1;padding:5px 10px;background:#51353b88;border-radius:999px}
.small-photo:nth-child(2){animation-delay:.55s}
.small-photo:nth-child(3){animation-delay:1.1s}
@keyframes photoReveal{from{opacity:0;transform:translateY(-20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.envelope{width:min(390px,100%);height:225px;padding:0;border:0;background:#e4bcc6;position:relative;box-shadow:0 20px 40px #76505a20;cursor:pointer;display:grid;place-items:center;transition:transform .25s,box-shadow .25s}
.envelope:hover{transform:translateY(-5px);box-shadow:0 25px 45px #76505a2b}
.envelope:before{content:"";position:absolute;inset:0 0 auto;height:54%;background:#f8e7e9;clip-path:polygon(0 0,100% 0,50% 100%)}
.envelope span{position:relative;z-index:2;display:block;padding-top:25px;color:var(--deep);font-family:"Cormorant Garamond",serif;font-size:25px;text-decoration:underline}

/* letter */
.letter-screen{align-items:center;justify-content:center}
.letter-page{width:min(980px,100%);background:var(--paper);border:1px solid #e6d9d8;padding:clamp(28px,5vw,65px);box-shadow:0 25px 70px #76505a18;min-height:72vh}
.letter-page h1{font-family:Parisienne,cursive;color:var(--rose);font-weight:400;font-size:clamp(55px,7vw,80px)}
.letter-photo{float:right;width:240px;height:300px;margin:0 0 25px 35px;background:linear-gradient(145deg,#d8b0b6,#bf808c);display:grid;place-items:center;color:white;overflow:hidden}
.letter-photo img{width:100%;height:100%;object-fit:cover}
.letter-page p{font-family:"Cormorant Garamond",serif;font-size:24px;line-height:1.45;color:#685357}

/* gift 2 gallery */
.gallery-page{align-items:center;justify-content:center}
.gallery-wrap{width:min(1120px,100%);margin:auto;padding:22px 0;text-align:center}
.gallery-wrap h1{font-family:Parisienne,cursive;font-size:clamp(48px,7vw,78px);font-weight:400;color:var(--deep);margin:10px 0}
.gallery-intro{color:#806d70;margin:0 auto 34px}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.gallery-card{margin:0;padding:10px 10px 15px;background:#fffdf9;border:1px solid #eadedf;box-shadow:0 15px 35px #76505a14;transform:rotate(var(--tilt,0deg));transition:transform .3s,box-shadow .3s}
.gallery-card:nth-child(3n+1){--tilt:-1deg}.gallery-card:nth-child(3n){--tilt:1deg}
.gallery-card:hover{transform:translateY(-6px) rotate(0);box-shadow:0 22px 42px #76505a20}
.gallery-photo{height:clamp(145px,22vw,230px);display:grid;place-items:center;color:#fff;font-size:42px;position:relative;overflow:hidden;background:linear-gradient(150deg,#d9b1b7,#a96776)}
.gallery-photo img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-photo:before,.gallery-photo:after{content:"";position:absolute;pointer-events:none}
.gallery-photo:before{inset:0;background:linear-gradient(180deg,#fff2 0%,transparent 45%,#51353b55 100%)}
.gallery-photo:after{width:120px;height:120px;border:1px solid #fff8;border-radius:50%;right:-36px;top:-45px}
.gallery-photo span{position:relative;z-index:1;text-shadow:0 2px 12px #51353b66}
.gallery-photo.scene-two{background:linear-gradient(155deg,#efd2c1 0 42%,#c68f94 43% 67%,#8b6772 68%)}
.gallery-photo.scene-three{background:linear-gradient(145deg,#d9c9b5,#b77f88 55%,#806572)}
.gallery-photo.scene-four{background:linear-gradient(155deg,#e8c4ba 0 40%,#c8878e 41% 70%,#806672 71%)}
.gallery-photo.scene-five{background:linear-gradient(145deg,#e8d9c2,#c58b8f 52%,#9c7274)}
.gallery-photo.scene-six{background:linear-gradient(155deg,#d7c7ba 0 38%,#b97884 39% 67%,#6e626d 68%)}
.gallery-card figcaption{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--deep);padding-top:10px}

/* reasons */
.reasons{align-items:center;justify-content:center}
.reason-wrap{width:min(1080px,100%);display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.reason-photo{height:530px;background:linear-gradient(145deg,#c78c97,#9c626e);display:grid;place-items:center;color:white;box-shadow:0 25px 60px #76505a20;overflow:hidden}
.reason-photo img{width:100%;height:100%;object-fit:cover}
.reason-title{font-family:"Cormorant Garamond",serif;font-size:clamp(55px,7vw,90px);line-height:.82;color:var(--deep)}
.reason-title #reason-count{font-family:Parisienne,cursive;color:var(--rose);font-size:1.2em}
.arrow{margin-top:30px;font-size:35px;border:0;background:none;color:var(--rose);cursor:pointer}

/* notebook */
.notebook-page{align-items:center;justify-content:center}
.notebook{width:min(1000px,100%);background:#fffdf9;border:1px solid #e5dada;box-shadow:0 25px 70px #76505a18;padding:clamp(25px,5vw,60px);position:relative}
.notebook:before{content:"";position:absolute;left:25%;top:0;bottom:0;border-left:1px solid #e7dada;opacity:.7}
.notebook h1{font-family:Parisienne,cursive;color:var(--rose);font-size:58px;font-weight:400}
.reasons-list{columns:2;column-gap:70px;list-style:none;padding:0;margin:25px 0 0}.reasons-list li{break-inside:avoid;font-family:"Cormorant Garamond",serif;font-size:20px;padding:6px 0;border-bottom:1px solid #eee4e3}
.reasons-list li:before{content:"♡ ";color:var(--rose)}

@media(max-width:760px){
 .pass-wrap,.yesno,.reason-wrap{grid-template-columns:1fr}.pass-intro{text-align:center}.memory-heart{width:260px}
 .yes-left,.yes-right{min-height:45svh}.yes-left{padding:25px}.yes-right{padding:35px 20px}
 .gift-grid{grid-template-columns:1fr;max-width:250px;margin:35px auto}.gift-box{height:145px}
 .gift1-content{grid-template-columns:minmax(0,1fr);max-width:410px;gap:28px}
 .small-photo{min-height:125px}
 .envelope{margin:0 auto;width:100%}
 .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
 .gallery-card{padding:7px 7px 12px}
 .gallery-photo{height:clamp(130px,34vw,210px)}
 .gallery-card figcaption{font-size:18px}
 .reason-wrap{gap:20px}.reason-photo{height:310px}.reasons-list{columns:1}.notebook:before{display:none}
}
@media(max-width:420px){
 .gallery-grid{grid-template-columns:1fr;max-width:330px;margin:auto}
 .gallery-photo{height:220px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

/* Twilight plum, candlelit ivory, and rose-gold */
:root{
  --rose:#d28a78;
  --deep:#4a263d;
  --dust:#c98978;
  --blush:#f0d6c7;
  --cream:#2b1d30;
  --paper:#fff8ed;
  --sage:#a3a88a;
  --ink:#392936;
  --line:#ead8c6;
}

button:focus-visible{outline-color:#f1c98a}
.app{background:radial-gradient(ellipse at 15% 10%,#623b55 0,transparent 42%),radial-gradient(ellipse at 90% 88%,#704052 0,transparent 38%),linear-gradient(135deg,#24192d,#3b263c 56%,#512e43)}
.app:before{opacity:.4;background:radial-gradient(circle at 20% 20%,#f4d6a5 0 1px,transparent 1.5px),radial-gradient(circle at 80% 70%,#f4d6a5 0 1px,transparent 1.5px)}
.brand{color:#f1d4a2;opacity:.9}
.kicker{color:#f1c98a}
.yes-right .kicker{color:#a85568}

.btn:hover{box-shadow:0 12px 30px #170e2466}
.back{border-color:#e8c68f;background:#fff8edf2;color:#4a263d}
.personalization{color:#f1d4a2!important}
#music-status{color:#4a263d;background:#fff8edeb}
#music-status:empty{display:none}
.pass-intro h1{color:#fff4e6}
.pass-intro p{color:#e2cdd2}
.pass-card{background:linear-gradient(145deg,#fffaf1,#f3e4d7);border-color:#edcc98;box-shadow:0 28px 80px #150d2466}
.pass-card h2,.box{color:#4a263d}
.box{border-color:#ddc8bc;background:#fffdf8}
.box.active{border-color:#bd6c78;box-shadow:0 0 0 3px #bd6c7830}
.key{border-color:#e5d6ca;background:#fffaf3;color:#4a263d}
.key:active{background:#efd5c8}
.enter{border-color:#efc98a;background:linear-gradient(135deg,#f7dfb1,#e9bd83)}
.error{background:radial-gradient(ellipse at top,#8b4a64,#3b203c 72%)}
.error .btn{background:#fff2de;color:#4a263d}
.yesno{background:#fff8ed;border-color:#e8c68f;box-shadow:0 30px 90px #160d256b}
.yes-left{background:radial-gradient(circle at 50% 38%,#76516a,#38223d 72%)}
.yes-photo{background:linear-gradient(145deg,#d99a83,#78445d);border-color:#fff8ed;box-shadow:0 20px 46px #1e102a66}
.yes-right{background:linear-gradient(155deg,#fff6e8,#f0d8c7)}
.yes-right h1,.nope h1{color:#4a263d}
.yes-right p,.nope-inner p{color:#715561}
.nope{background:radial-gradient(circle at 50% 20%,#fff1dc,#e7c8bd 50%,#8d5a70 100%)}
.battle-spark{color:#b66872}
.gift-wrap h1,.gift,.inner,.gallery-wrap h1,.gallery-card figcaption,.reason-title{color:#fff3e5}
.gift-wrap p,.gallery-intro{color:#e2cdd2}
.gift-box{background:linear-gradient(135deg,#a5526c,#63324f);box-shadow:0 20px 42px #160d255c}
.gift-box:before{background:linear-gradient(90deg,#e9bb75,#f7dda5,#d99b68)}
.gift-box:after{border-color:#e9bb75}
.gift-label{border-color:#e8c68f;background:#fff6e8;color:#4a263d}
.small-photo{background:linear-gradient(145deg,#d99a83,#78445d);border-color:#fff8ed;box-shadow:0 14px 34px #170e244a}
.photo-caption{background:#321c35d9;color:#fff6e8}
.envelope{background:linear-gradient(145deg,#d49a86,#b76a76);box-shadow:0 22px 46px #1b10284d}
.envelope:before{background:linear-gradient(145deg,#f9e8cc,#efd2bd)}
.envelope span{color:#4a263d}
.letter-page,.notebook{background:linear-gradient(145deg,#fffaf1,#f6eade);border-color:#e8cda8;box-shadow:0 28px 80px #170e244d}
.letter-page h1,.notebook h1{color:#a85568}
.letter-page p{color:#594453}
.letter-photo{background:linear-gradient(145deg,#d99a83,#78445d)}
.gallery-card{background:#fff8ed;border-color:#e9d4bf;box-shadow:0 16px 38px #180e2744}
.gallery-card:hover{box-shadow:0 24px 48px #180e275f}
.gallery-photo{background:linear-gradient(150deg,#d99a83,#70405d)}
.gallery-photo.scene-two{background:linear-gradient(155deg,#f1d2b0 0 42%,#be7883 43% 67%,#55405a 68%)}
.gallery-photo.scene-three{background:linear-gradient(145deg,#e7d4b8,#ba7881 55%,#55405a)}
.gallery-photo.scene-four{background:linear-gradient(155deg,#f0cfad 0 40%,#c47b82 41% 70%,#55405a 71%)}
.gallery-photo.scene-five{background:linear-gradient(145deg,#eeddbd,#c78382 52%,#704858)}
.gallery-photo.scene-six{background:linear-gradient(155deg,#e4d0ba 0 38%,#b96d7b 39% 67%,#4c3d55 68%)}
.gallery-card figcaption{color:#4a263d}
.reason-photo{background:linear-gradient(145deg,#d99a83,#63324f);box-shadow:0 28px 65px #170e2459}
.reason-title #reason-count{color:#efc98a}
.arrow{color:#f1c98a}
.notebook h1{color:#a85568}
.notebook:before{border-color:#ddcbb9}
.reasons-list li{border-color:#eaded1;color:#594453}
.reasons-list li:before{color:#b66872}
@media(max-width:760px){
 .pass-intro h1{font-size:clamp(43px,11vw,68px)}
 .music-player{right:12px;bottom:12px}
}

.btn,.back,.key,.gift-label{
 border-color:#b88786;
 background:linear-gradient(145deg,#563b52,#3c2a43);
 color:#fff3e4;
}
.btn:hover{background:linear-gradient(145deg,#65445d,#49314f);box-shadow:0 12px 30px #170e2466}
.back:hover,.key:hover,.gift-label:hover{background:linear-gradient(145deg,#65445d,#49314f)}
.key:active{background:#76516a}
.enter,.error .btn{
 border:1px solid #d0a276;
 background:linear-gradient(145deg,#563b52,#3c2a43);
 color:#fff3e4;
}
.envelope{background:linear-gradient(145deg,#563b52,#3c2a43);box-shadow:0 20px 40px #170e245c}
.envelope:before{background:linear-gradient(145deg,#69445e,#4c3350)}
.envelope span{color:#fff3e4}
</style>
</head>
<body>
<div class="app">

<section id="password" class="screen password active">
<div class="brand"></div>
<div class="pass-wrap">
<div class="pass-intro">
<div class="memory-heart"><img id="photo-cover" alt=""></div>
<div class="kicker" id="intro-kicker"></div>
<h1 id="intro-title"></h1>
<p id="intro-message"></p>
<p class="personalization" id="personalization"></p>
</div>
<div class="pass-card">
<div class="lock">♡</div><h2 id="password-title"></h2>
<div class="boxes" id="boxes"><div class="box active"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
<div class="keypad">
<button class="key" onclick="key('1')">1</button><button class="key" onclick="key('2')">2</button><button class="key" onclick="key('3')">3</button>
<button class="key" onclick="key('4')">4</button><button class="key" onclick="key('5')">5</button><button class="key" onclick="key('6')">6</button>
<button class="key" onclick="key('7')">7</button><button class="key" onclick="key('8')">8</button><button class="key" onclick="key('9')">9</button>
<button class="key" onclick="key('*')">*</button><button class="key" onclick="key('0')">0</button><button class="key" onclick="key('#')">#</button>
<button class="key enter" id="enter-button" onclick="checkPass()"></button>
</div>
</div></div>
<div id="error" class="error"><div class="error-inner"><div class="error-title" id="wrong-title"></div><p id="wrong-message"></p><button class="btn" id="try-again-button" onclick="tryAgain()"></button></div></div>
</section>

<section id="surprise" class="screen surprise">
<div class="brand"></div>
<div class="yesno">
<div class="yes-left"><div class="yes-photo"><img id="photo-question" alt=""></div></div>
<div class="yes-right">
<div class="kicker" id="question-kicker"></div>
<h1 id="question-title"></h1>
<p id="question-prompt"></p>
<div class="couple">♡ 🧸 ♡</div>
<div class="choice"><button class="btn" id="yes-button" onclick="show('gifts')"></button><button class="btn" id="no-button" onclick="show('nope')"></button></div>
</div></div>
</section>

<section id="nope" class="screen nope">
<div class="brand"></div><div class="nope-inner"><div class="bear-battle" aria-label="Two teddy bears having a playful pillow fight"><span class="bear">🧸</span><span class="battle-spark" aria-hidden="true">✦</span><span class="bear">🧸</span></div><h1 id="no-title"></h1><p id="no-message"></p><button class="btn" id="no-try-again-button" onclick="show('surprise')"></button></div>
</section>

<section id="gifts" class="screen gifts">
<div class="brand"></div><div class="gift-wrap"><div class="kicker" id="gifts-kicker"></div><h1 id="gifts-title"></h1><p id="gifts-message"></p>
<div class="gift-grid">
<button class="gift" onclick="show('gift1')"><div class="gift-box"></div><span class="gift-label" id="gift-label-1"></span></button>
<button class="gift" onclick="show('gift2')"><div class="gift-box"></div><span class="gift-label" id="gift-label-2"></span></button>
<button class="gift" onclick="show('gift3')"><div class="gift-box"></div><span class="gift-label" id="gift-label-3"></span></button>
</div></div>
</section>

<section id="gift1" class="screen inner">
<button class="back" onclick="show('gifts')"></button>
<div><div class="kicker" id="gift1-kicker"></div><h1 id="gift1-title"></h1>
<div class="gift1-content"><div class="photo-strip"><div class="small-photo"><img id="photo-gift1a" alt=""><span class="photo-caption" id="gift1-caption-1"></span></div><div class="small-photo"><img id="photo-gift1b" alt=""><span class="photo-caption" id="gift1-caption-2"></span></div><div class="small-photo"><img id="photo-gift1c" alt=""><span class="photo-caption" id="gift1-caption-3"></span></div></div>
<button class="envelope" type="button" onclick="show('letter')"><span id="open-letter-button"></span></button></div></div>
</section>

<section id="letter" class="screen letter-screen">
<button class="back" onclick="show('gifts')"></button>
<div class="letter-page"><div class="letter-photo"><img id="photo-letter" alt=""></div><h1 id="letter-title"></h1>
<div id="letter-paragraphs"></div></div>
</section>

<section id="gift2" class="screen gallery-page">
<button class="back" onclick="show('gifts')"></button>
<div class="gallery-wrap"><div class="kicker" id="gallery-kicker"></div><h1 id="gallery-title"></h1><p class="gallery-intro" id="gallery-message"></p>
<div class="gallery-grid">
<figure class="gallery-card"><div class="gallery-photo"><img id="photo-gallery1" alt=""></div><figcaption id="gallery-caption-1"></figcaption></figure>
<figure class="gallery-card"><div class="gallery-photo scene-two"><img id="photo-gallery2" alt=""></div><figcaption id="gallery-caption-2"></figcaption></figure>
<figure class="gallery-card"><div class="gallery-photo scene-three"><img id="photo-gallery3" alt=""></div><figcaption id="gallery-caption-3"></figcaption></figure>
<figure class="gallery-card"><div class="gallery-photo scene-four"><img id="photo-gallery4" alt=""></div><figcaption id="gallery-caption-4"></figcaption></figure>
<figure class="gallery-card"><div class="gallery-photo scene-five"><img id="photo-gallery5" alt=""></div><figcaption id="gallery-caption-5"></figcaption></figure>
<figure class="gallery-card"><div class="gallery-photo scene-six"><img id="photo-gallery6" alt=""></div><figcaption id="gallery-caption-6"></figcaption></figure>
</div></div>
</section>

<section id="gift3" class="screen reasons">
<button class="back" onclick="show('gifts')"></button>
<div class="reason-wrap"><div class="reason-photo"><img id="photo-reasons" alt=""></div><div><div class="kicker" id="reasons-kicker"></div><div class="reason-title"><span id="reason-count"></span><br><span id="reasons-title"></span></div><button class="arrow" onclick="show('reasons')">→</button></div></div>
</section>

<section id="reasons" class="screen notebook-page">
<button class="back" onclick="show('gifts')"></button>
<div class="notebook"><h1 id="reasons-heading"></h1><ul class="reasons-list" id="reasons-list"></ul></div>
</section>

</div>
<div class="music-player">
<button class="btn" id="music-button" type="button" onclick="toggleMusic()"></button>
<span id="music-status" role="status" aria-live="polite"></span>
<audio id="background-music" loop preload="none"></audio>
</div>
<script src="config.js"></script>
<script>
let entered="";
const config=window.ANNIVERSARY_CONFIG;
const copy=config.copy;
const correct=config.passcode;
function setText(id,value){
 document.getElementById(id).textContent=value;
}
function setLines(id,lines){
 const element=document.getElementById(id);
 lines.forEach((line,index)=>{
  if(index)element.append(document.createElement("br"));
  element.append(document.createTextNode(line));
 });
}
function setPhoto(id,photo){
 const image=document.getElementById(id);
 image.src=photo.src;
 image.alt=photo.alt;
}
function personalizePage(){
 document.title=config.pageTitle;
 document.querySelectorAll(".brand").forEach(brand=>brand.textContent=copy.brand);
 setLines("intro-title",copy.introTitle);
 setLines("question-title",copy.questionTitle);
 [
  ["intro-kicker",copy.introKicker],["intro-message",copy.introMessage],
  ["password-title",copy.passwordTitle],["enter-button",copy.enterButton],
  ["wrong-title",copy.wrongTitle],["wrong-message",copy.wrongMessage],
  ["try-again-button",copy.tryAgain],["question-kicker",copy.questionKicker],
  ["question-prompt",copy.questionPrompt],["yes-button",copy.yesButton],
  ["no-button",copy.noButton],["no-title",copy.noTitle],
  ["no-message",copy.noMessage],["no-try-again-button",copy.tryAgain],
  ["gifts-kicker",copy.giftsKicker],["gifts-title",copy.giftsTitle],
  ["gifts-message",copy.giftsMessage],["gift1-kicker",copy.gift1Kicker],
  ["gift1-title",copy.gift1Title],["open-letter-button",copy.openLetterButton],
  ["letter-title",copy.letterTitle],["gallery-kicker",copy.galleryKicker],
  ["gallery-title",copy.galleryTitle],["gallery-message",copy.galleryMessage],
  ["reasons-kicker",copy.reasonsKicker],["reasons-title",copy.reasonsTitle],
  ["reasons-heading",`${copy.reasons.length} ${copy.reasonsHeading}`]
 ].forEach(([id,value])=>setText(id,value));
 setText("personalization",`${config.coupleNames} · ${config.anniversaryDate}`);
 copy.giftLabels.forEach((label,index)=>setText(`gift-label-${index+1}`,label));
 copy.gift1PhotoCaptions.forEach((caption,index)=>setText(`gift1-caption-${index+1}`,caption));
 copy.galleryCaptions.forEach((caption,index)=>setText(`gallery-caption-${index+1}`,caption));
 copy.letterParagraphs.forEach(paragraph=>{
  const element=document.createElement("p");
  element.textContent=paragraph;
  document.getElementById("letter-paragraphs").append(element);
 });
 copy.reasons.forEach(reason=>{
  const element=document.createElement("li");
  element.textContent=reason;
  document.getElementById("reasons-list").append(element);
 });
 setText("reason-count",copy.reasons.length);
 Object.entries(config.photos).forEach(([key,photo])=>{
  setPhoto(`photo-${key}`,photo);
 });
 document.querySelectorAll(".back").forEach(button=>button.textContent=copy.backButton);
 const audio=document.getElementById("background-music");
 audio.src=config.music.src;
 document.getElementById("music-button").textContent=config.music.buttonLabel;
 audio.addEventListener("error",()=>{
  setText("music-status",`Unable to load music: ${config.music.src}`);
 });
}
async function toggleMusic(){
 const audio=document.getElementById("background-music");
 const button=document.getElementById("music-button");
 if(audio.paused){
  try{
   await audio.play();
   setText("music-status","Music is playing");
   setText("music-button","Pause music");
  }catch(error){
   setText("music-status","Music could not be played. Check the configured music file.");
   console.error("Music playback failed.",error);
  }
 }else{
  audio.pause();
  setText("music-status","Music paused");
  setText("music-button",config.music.buttonLabel);
 }
}
function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderBoxes(){
 document.querySelectorAll("#boxes .box").forEach((b,i)=>{
  b.textContent=entered[i]||"";
  b.classList.toggle("active",i===entered.length);
 });
}
function key(v){
 if(entered.length>=4)return;
 entered+=v; renderBoxes();
 const b=document.querySelectorAll("#boxes .box")[entered.length-1];
 if(b)b.animate([{transform:"scale(.82)"},{transform:"scale(1.08)"},{transform:"scale(1)"}],{duration:300});
 if(entered.length===4)setTimeout(checkPass,320);
}
function checkPass(){
 if(entered===correct){
  setTimeout(()=>show("surprise"),380);
 }else{
  document.getElementById("error").classList.add("show");
 }
}
function tryAgain(){
 document.getElementById("error").classList.remove("show");
 entered="";renderBoxes();
}
personalizePage();
renderBoxes();
</script>
</body>
</html>
